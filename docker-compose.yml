---
volumes:
  caddy-data:
  caddy-config:
  calendar-database:

services:
  caddy:
    image: caddy@sha256:ec18ee54aab3315c22e25f3b2babda73ff8007d39b13b3bd1bfffa2f0444c7d9
    restart: unless-stopped
    environment:
      HOSTNAME: "events.example.testing"
    ports:
      - 80:80/tcp
      - 443:443/tcp
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

  calendar:
    image: ghcr.io/mgnsk/calendar:edge
    build:
      context: .
    command: /bin/calendar
    container_name: calendar
    restart: unless-stopped
    environment:
      LISTEN_ADDR: ":8080"
      DATABASE_DIR: "/database"
    volumes:
      - calendar-database:/database
